<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="AI Interview Coach system architecture">
  <title>AI Interview Coach — system architecture</title>
  <desc>React frontend calls Next.js API routes guarded by Zod validation and rate limiting, which branch into an AI provider chain (Gemini, Claude, demo), a local ML path (MiniLM embeddings + cosine similarity), and a data path (Auth.js, Prisma, SQLite/Postgres).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="700" height="480" rx="16" fill="#0b0e22"/>
  <text x="350" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">AI Interview Coach — Architecture</text>

  <!-- connectors -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <line x1="350" y1="92" x2="350" y2="115" marker-end="url(#arrow)"/>
    <path d="M190 170 Q140 188 132 206" marker-end="url(#arrow)"/>
    <line x1="350" y1="170" x2="350" y2="206" marker-end="url(#arrow)"/>
    <path d="M510 170 Q560 188 568 206" marker-end="url(#arrow)"/>
    <line x1="130" y1="258" x2="130" y2="282" marker-end="url(#arrow)"/>
    <line x1="130" y1="330" x2="130" y2="354" marker-end="url(#arrow)"/>
    <line x1="350" y1="258" x2="350" y2="282" marker-end="url(#arrow)"/>
    <line x1="570" y1="258" x2="570" y2="282" marker-end="url(#arrow)"/>
    <line x1="570" y1="330" x2="570" y2="354" marker-end="url(#arrow)"/>
  </g>
  <text x="150" y="194" font-size="10" fill="#94a3b8">AI</text>
  <text x="356" y="194" font-size="10" fill="#94a3b8">ML</text>
  <text x="548" y="194" font-size="10" fill="#94a3b8">data</text>

  <!-- Frontend -->
  <rect x="180" y="42" width="340" height="50" rx="10" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="350" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0ff">Frontend</text>
  <text x="350" y="80" text-anchor="middle" font-size="11.5" fill="#9aa3c7">Next.js · React · Tailwind · PWA</text>

  <!-- API -->
  <rect x="70" y="116" width="560" height="54" rx="10" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="350" y="140" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0ff">Next.js API Routes (REST)</text>
  <text x="350" y="158" text-anchor="middle" font-size="11.5" fill="#9aa3c7">Zod validation · rate limiting · streaming</text>

  <!-- AI providers column -->
  <rect x="30" y="210" width="200" height="48" rx="10" fill="#102a22" stroke="#34d399" stroke-width="1.5"/>
  <text x="130" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#d6f7ea">Google Gemini 2.5</text>
  <text x="130" y="248" text-anchor="middle" font-size="10.5" fill="#8fd9c2">primary provider</text>
  <rect x="30" y="282" width="200" height="48" rx="10" fill="#2a1c12" stroke="#f59e6b" stroke-width="1.5"/>
  <text x="130" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#fbe2d4">Anthropic Claude</text>
  <text x="130" y="320" text-anchor="middle" font-size="10.5" fill="#dcae93">fallback</text>
  <rect x="30" y="354" width="200" height="48" rx="10" fill="#1a1f2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="130" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Demo engine</text>
  <text x="130" y="392" text-anchor="middle" font-size="10.5" fill="#94a3b8">no key</text>

  <!-- Local ML column -->
  <rect x="250" y="210" width="200" height="48" rx="10" fill="#1c1b34" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#e9e4ff">MiniLM embeddings</text>
  <text x="350" y="248" text-anchor="middle" font-size="10.5" fill="#b9add9">384-d vectors · local</text>
  <rect x="250" y="282" width="200" height="48" rx="10" fill="#1c1b34" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="350" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#e9e4ff">Cosine similarity</text>
  <text x="350" y="320" text-anchor="middle" font-size="10.5" fill="#b9add9">0–100 match score</text>
  <text x="350" y="372" text-anchor="middle" font-size="10.5" fill="#94a3b8">CV fit · answer relevance</text>

  <!-- Data column -->
  <rect x="470" y="210" width="200" height="48" rx="10" fill="#1a1f2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="570" y="231" text-anchor="middle" font-size="13" font-weight="700" fill="#e2e8f0">Auth.js (NextAuth)</text>
  <text x="570" y="248" text-anchor="middle" font-size="10.5" fill="#94a3b8">JWT · bcrypt</text>
  <rect x="470" y="282" width="200" height="48" rx="10" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="570" y="303" text-anchor="middle" font-size="13" font-weight="700" fill="#eef0ff">Prisma ORM</text>
  <text x="570" y="320" text-anchor="middle" font-size="10.5" fill="#9aa3c7">models · migrations</text>
  <rect x="470" y="354" width="200" height="48" rx="10" fill="#0f2a30" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="570" y="375" text-anchor="middle" font-size="13" font-weight="700" fill="#cdf4fb">SQLite / Postgres</text>
  <text x="570" y="392" text-anchor="middle" font-size="10.5" fill="#8fd6e3">dev / production</text>

  <!-- legend -->
  <rect x="44" y="446" width="11" height="11" rx="3" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="61" y="455" font-size="10.5" fill="#94a3b8">App code</text>
  <rect x="150" y="446" width="11" height="11" rx="3" fill="#102a22" stroke="#34d399" stroke-width="1.5"/>
  <text x="167" y="455" font-size="10.5" fill="#94a3b8">Primary AI</text>
  <rect x="270" y="446" width="11" height="11" rx="3" fill="#2a1c12" stroke="#f59e6b" stroke-width="1.5"/>
  <text x="287" y="455" font-size="10.5" fill="#94a3b8">Fallback</text>
  <rect x="378" y="446" width="11" height="11" rx="3" fill="#1c1b34" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="395" y="455" font-size="10.5" fill="#94a3b8">Local ML</text>
  <rect x="490" y="446" width="11" height="11" rx="3" fill="#0f2a30" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="507" y="455" font-size="10.5" fill="#94a3b8">Database</text>
</svg>
