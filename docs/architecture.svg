<svg viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="AI Interview Coach system architecture">
  <title>AI Interview Coach — system architecture</title>
  <desc>React frontend calls Next.js API routes guarded by Zod validation and rate limiting, which branch to an AI provider chain (Gemini primary, Claude fallback, demo engine) and a data path (Auth.js, Prisma, SQLite/Postgres).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="680" height="480" rx="16" fill="#0b0e22"/>
  <text x="340" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#f1f5f9">AI Interview Coach — Architecture</text>

  <!-- connectors -->
  <g fill="none" stroke="#64748b" stroke-width="1.5">
    <line x1="340" y1="94" x2="340" y2="116" marker-end="url(#arrow)"/>
    <path d="M300 174 Q250 193 214 208" marker-end="url(#arrow)"/>
    <path d="M380 174 Q430 193 466 208" marker-end="url(#arrow)"/>
    <line x1="210" y1="264" x2="210" y2="286" marker-end="url(#arrow)"/>
    <line x1="210" y1="338" x2="210" y2="360" marker-end="url(#arrow)"/>
    <line x1="470" y1="264" x2="470" y2="286" marker-end="url(#arrow)"/>
    <line x1="470" y1="338" x2="470" y2="360" marker-end="url(#arrow)"/>
  </g>
  <text x="232" y="199" font-size="10" fill="#94a3b8">AI</text>
  <text x="430" y="199" font-size="10" fill="#94a3b8">data</text>
  <text x="218" y="280" font-size="9.5" fill="#94a3b8">on error</text>
  <text x="218" y="354" font-size="9.5" fill="#94a3b8">no key</text>

  <!-- Frontend (blue) -->
  <rect x="160" y="42" width="360" height="52" rx="10" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="340" y="62" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0ff">Frontend</text>
  <text x="340" y="80" text-anchor="middle" font-size="11.5" fill="#9aa3c7">Next.js · React · Tailwind · PWA</text>

  <!-- API layer (blue) -->
  <rect x="90" y="118" width="500" height="56" rx="10" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="340" y="142" text-anchor="middle" font-size="14" font-weight="700" fill="#eef0ff">Next.js API Routes (REST)</text>
  <text x="340" y="160" text-anchor="middle" font-size="11.5" fill="#9aa3c7">Zod validation · rate limiting · streaming</text>

  <!-- AI path -->
  <rect x="110" y="212" width="200" height="52" rx="10" fill="#102a22" stroke="#34d399" stroke-width="1.5"/>
  <text x="210" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#d6f7ea">Google Gemini 2.5</text>
  <text x="210" y="250" text-anchor="middle" font-size="11" fill="#8fd9c2">primary provider</text>

  <rect x="110" y="288" width="200" height="50" rx="10" fill="#2a1c12" stroke="#f59e6b" stroke-width="1.5"/>
  <text x="210" y="307" text-anchor="middle" font-size="13.5" font-weight="700" fill="#fbe2d4">Anthropic Claude</text>
  <text x="210" y="325" text-anchor="middle" font-size="11" fill="#dcae93">fallback</text>

  <rect x="110" y="362" width="200" height="50" rx="10" fill="#1a1f2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="210" y="381" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e2e8f0">Demo engine</text>
  <text x="210" y="399" text-anchor="middle" font-size="11" fill="#94a3b8">deterministic · no key</text>

  <!-- Data path -->
  <rect x="370" y="212" width="200" height="52" rx="10" fill="#1a1f2e" stroke="#64748b" stroke-width="1.5"/>
  <text x="470" y="232" text-anchor="middle" font-size="13.5" font-weight="700" fill="#e2e8f0">Auth.js (NextAuth)</text>
  <text x="470" y="250" text-anchor="middle" font-size="11" fill="#94a3b8">JWT · bcrypt</text>

  <rect x="370" y="288" width="200" height="50" rx="10" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="470" y="307" text-anchor="middle" font-size="13.5" font-weight="700" fill="#eef0ff">Prisma ORM</text>
  <text x="470" y="325" text-anchor="middle" font-size="11" fill="#9aa3c7">models · migrations</text>

  <rect x="370" y="362" width="200" height="50" rx="10" fill="#0f2a30" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="470" y="381" text-anchor="middle" font-size="13.5" font-weight="700" fill="#cdf4fb">SQLite / Postgres</text>
  <text x="470" y="399" text-anchor="middle" font-size="11" fill="#8fd6e3">dev / production</text>

  <!-- legend -->
  <rect x="92" y="446" width="12" height="12" rx="3" fill="#161a36" stroke="#5b6cff" stroke-width="1.5"/>
  <text x="110" y="456" font-size="11" fill="#94a3b8">App code</text>
  <rect x="200" y="446" width="12" height="12" rx="3" fill="#102a22" stroke="#34d399" stroke-width="1.5"/>
  <text x="218" y="456" font-size="11" fill="#94a3b8">Primary AI</text>
  <rect x="322" y="446" width="12" height="12" rx="3" fill="#2a1c12" stroke="#f59e6b" stroke-width="1.5"/>
  <text x="340" y="456" font-size="11" fill="#94a3b8">Fallback</text>
  <rect x="432" y="446" width="12" height="12" rx="3" fill="#0f2a30" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="450" y="456" font-size="11" fill="#94a3b8">Database</text>
</svg>
